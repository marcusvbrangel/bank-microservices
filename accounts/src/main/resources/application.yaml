server:
  port: 8081
  name: accounts

spring:
  application:
    name: accounts
  profiles:
    active: prod
  datasource:
    hikari:
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:20000}
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:5}

    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/accountsdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
    ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import: "optional:configserver:http://localhost:9091/"

management:
  endpoints:
    enable-by-default: false
    web:
      exposure:
        include: "health, metrics"
  endpoint:
    health:
      enable: true
      show-details: always
    metrics:
      enable: true










