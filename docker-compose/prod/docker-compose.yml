services:

  configserver:
    image: "marcusvbrangel/configserver:1.0.1"
    container_name: configserver-ms
    ports:
      - "9091:9091"
    extends:
      file: common-config.yml
      service: microservice-base-config

  accounts:
    image: "marcusvbrangel/accounts:1.0.1"
    container_name: accounts-ms
    ports:
      - "8081:8081"
    depends_on:
      - configserver
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "marcusvbrangel/loans:1.0.1"
    container_name: loans-ms
    ports:
      - "8082:8082"
    depends_on:
      - configserver
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "marcusvbrangel/cards:1.0.1"
    container_name: accounts-ms
    ports:
      - "8083:8083"
    depends_on:
      - configserver
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  wolfbank-network:
    driver: "bridge"
