services:

  configserver:
    image: "marcusvbrangel/configserver:1.0.1"
    container_name: configserver-ms
    ports:
      - "9091:9091"
    extends:
      file: common-config.yml
      service: microservice-base-config

  accounts:
    image: "marcusvbrangel/accounts:1.0.1"
    container_name: accounts-ms
    ports:
      - "8081:8081"
    depends_on:
      - configserver
      - postgres
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountsdb
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "marcusvbrangel/loans:1.0.1"
    container_name: loans-ms
    ports:
      - "8082:8082"
    depends_on:
      - configserver
      - postgres
    environment:
      SPRING_APPLICATION_NAME: "loans"
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/loansdb
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "marcusvbrangel/cards:1.0.1"
    container_name: cards-ms
    ports:
      - "8083:8083"
    depends_on:
      - configserver
      - postgres
    environment:
      SPRING_APPLICATION_NAME: "cards"
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/cardsdb
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  postgres:
    image: postgres:16.3-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./local-volumes/postgres/data:/var/lib/postgresql/data
      #- ./local-volumes/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wolfbank-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "9999:80"
    depends_on:
      - postgres
    networks:
      - wolfbank-network

networks:
  wolfbank-network:
    driver: "bridge"
